<p-table [value]="documentsResponse.documents" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>GUID</th>
      <th>Code</th>
      <th>Title</th>
      <th>Revision</th>
      <th>Planned Date</th>
      <th>Value</th>
    </tr>
  </ng-template>
  <ng-template #body let-document>
    <tr>
      <td>{{ document.guid }}</td>
      <td>{{ document.code }}</td>
      <td>{{ document.title }}</td>
      <td>{{ document.revision }}</td>
      <td>{{ document.plannedDate }}</td>
      <td>{{ document.value }}</td>
    </tr>
  </ng-template>
</p-table>
